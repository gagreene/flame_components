name: Tests

on:
  pull_request:
    branches: [master, pre_release, "feature/**"]
  push:
    branches: [master, pre_release]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  standalone-rust:
    uses: ./.github/workflows/standalone-rust.yml

  python-distributions:
    uses: ./.github/workflows/python-distributions.yml

  source-checkout:
    name: Python source checkout
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Smoke-test Python sources without building the package
        run: |
          uv venv --python python "$RUNNER_TEMP/source-test"
          uv pip install --python "$RUNNER_TEMP/source-test" 'numpy>=1.23.2'
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python="$RUNNER_TEMP/source-test/bin/python"
          "$python" scripts/smoke_test.py --backend auto
          "$python" -c "from flame_components._backend import resolve_backend; assert resolve_backend('auto') == 'python'"

  # Keep the required check names used by the branch rules. Each name gates
  # the entire current test matrix.
  required-python-checks:
    name: ${{ matrix.context }}
    if: ${{ always() }}
    needs: [standalone-rust, python-distributions, source-checkout]
    permissions: {}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    strategy:
      matrix:
        context:
          - "pytest (ubuntu-latest, py3.11)"
          - "pytest (ubuntu-latest, py3.12)"
          - "pytest (ubuntu-latest, py3.13)"
          - "pytest (ubuntu-latest, py3.14)"
          - "pytest (windows-latest, py3.12)"
          - "pytest (Python 3.11, NumPy 1.23.2 minimum)"
          - "pytest (macos-latest, py3.12)"
    steps:
      - name: Require the complete test matrix
        env:
          STANDALONE_RESULT: ${{ needs.standalone-rust.result }}
          DISTRIBUTIONS_RESULT: ${{ needs.python-distributions.result }}
          SOURCE_RESULT: ${{ needs.source-checkout.result }}
        run: |
          test "$STANDALONE_RESULT" = success
          test "$DISTRIBUTIONS_RESULT" = success
          test "$SOURCE_RESULT" = success
