name: Tests

on:
  pull_request:
    branches: [master, pre_release, "feature/**"]
  push:
    branches: [master, pre_release]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  standalone-rust:
    uses: ./.github/workflows/standalone-rust.yml

  python-distributions:
    uses: ./.github/workflows/python-distributions.yml

  source-checkout:
    name: Python source checkout
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Smoke-test Python sources without building the package
        run: |
          uv venv --python python "$RUNNER_TEMP/source-test"
          uv pip install --python "$RUNNER_TEMP/source-test" 'numpy>=1.23.2'
          PYTHONPATH="$GITHUB_WORKSPACE/src" "$RUNNER_TEMP/source-test/bin/python" \
            scripts/smoke_test.py --backend python
