name: Publish

# Runs only for a deliberate, human-published GitHub Release -- never on a bare tag push.
# Mark the Release as "pre-release" (e.g. a v0.2.0rc1 tag) to publish to TestPyPI, or as a
# full release (e.g. v0.2.0) to publish to PyPI. See docs/RELEASING.md.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  python-distributions:
    uses: ./.github/workflows/python-distributions.yml
    with:
      release-tag: ${{ github.event.release.tag_name }}
      release-prerelease: ${{ github.event.release.prerelease }}

  standalone-rust:
    uses: ./.github/workflows/standalone-rust.yml
    with:
      upload-cli: true

  build:
    name: Validate and attach release assets
    needs: [python-distributions, standalone-rust]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write  # needed to attach files to the GitHub Release
    steps:
      - uses: astral-sh/setup-uv@v10.0.1

      - name: Download wheels
        uses: actions/download-artifact@v7
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/

      - name: Download source distribution
        uses: actions/download-artifact@v7
        with:
          name: sdist
          path: dist/

      - name: Download standalone executables
        uses: actions/download-artifact@v7
        with:
          pattern: cli-*
          merge-multiple: true
          path: cli/

      - name: Verify release wheel coverage
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/flame_components-*.tar.gz)
          if (( ${#wheels[@]} != 20 || ${#sdists[@]} != 1 )); then
            echo "Expected 20 wheels and 1 sdist; found ${#wheels[@]} wheels and ${#sdists[@]} source distributions." >&2
            exit 1
          fi
          for python in cp311 cp312 cp313 cp314; do
            for platform in 'win_amd64' 'macosx_*_arm64' 'macosx_*_x86_64' \
              '*manylinux_2_17_x86_64*' '*manylinux_2_17_aarch64*'; do
              matches=(dist/flame_components-*-"$python"-"$python"-$platform.whl)
              if (( ${#matches[@]} != 1 )); then
                echo "Expected one wheel for $python and $platform; found ${#matches[@]}." >&2
                exit 1
              fi
            done
          done

      - name: Validate Python distributions
        run: uvx --python 3.12 twine check dist/*

      - name: Upload Python distributions as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Attach Python distributions and CLI binaries to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* cli/* --clobber

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event.release.prerelease == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/flame-components/
    permissions:
      id-token: write  # required for Trusted Publishing; granted only to this job
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/flame-components/
    permissions:
      id-token: write  # required for Trusted Publishing; granted only to this job
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
