[package]
name = "flame-components"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Standalone flame characteristics for surface and crown fire models"

readme = "README.md"
# The repository-level fixture file is shared with the Python tests.
exclude = ["tests/reference.rs"]

[features]
extended = ["dep:flame-components-wide"]

[dependencies]
flame-components-wide = { version = "=0.1.0-rc.1", path = "../flame-components-wide", optional = true }
half = "=2.4.1"
ndarray.workspace = true

[dev-dependencies]
serde_json.workspace = true
